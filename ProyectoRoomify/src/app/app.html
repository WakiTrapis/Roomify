<div class="app-shell">
    @if (flatId(); as id) {
    <app-sidebar [flatId]="id" [open]="sidebarOpen()" (navigate)="closeSidebar()" />

    @if (sidebarOpen()) {
    <div class="sidebar-backdrop d-lg-none" (click)="closeSidebar()"></div>
    }
    }

    <div class="app-main">
        @if (!isLogin()) {
        <app-topbar [flat]="currentFlat()" [showMenuButton]="flatId() !== null" (menuToggle)="toggleSidebar()" />
        }

        <main class="app-content" [class.p-3]="!isLogin()" [class.p-md-4]="!isLogin()">
            <router-outlet />
        </main>
    </div>
</div>
