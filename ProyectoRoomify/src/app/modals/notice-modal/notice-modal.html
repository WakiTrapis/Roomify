<form [formGroup]="form" (ngSubmit)="save()">
    <div class="modal-header">
        <h5 class="modal-title">{{ isEdit() ? 'Editar comunicado' : 'Nuevo comunicado' }}</h5>
        <button type="button" class="btn-close" aria-label="Cerrar" (click)="cancel()"></button>
    </div>

    <div class="modal-body">
        <div class="mb-3">
            <label for="title" class="form-label">Título</label>
            <input id="title" type="text" class="form-control" formControlName="title"
                [class.is-invalid]="isInvalid('title')" placeholder="Ej: Normas de silencio" />
            <div class="invalid-feedback">El título es obligatorio (máximo 80 caracteres).</div>
        </div>

        <div class="mb-3">
            <label for="content" class="form-label">Contenido</label>
            <textarea id="content" rows="4" class="form-control" formControlName="content"
                [class.is-invalid]="isInvalid('content')"></textarea>
            <div class="invalid-feedback">El contenido es obligatorio (máximo 600 caracteres).</div>
        </div>

        <div class="row">
            <div class="col-md-6 mb-3">
                <label for="type" class="form-label">Tipo</label>
                <select id="type" class="form-select" formControlName="type">
                    @for (t of types; track t.value) {
                    <option [value]="t.value">{{ t.label }}</option>
                    }
                </select>
            </div>

            <div class="col-md-6 mb-3">
                <label for="date" class="form-label">Fecha</label>
                <input id="date" type="date" class="form-control" formControlName="date"
                    [class.is-invalid]="isInvalid('date')" />
                <div class="invalid-feedback">La fecha es obligatoria.</div>
            </div>
        </div>
    </div>

    <div class="modal-footer">
        <button type="button" class="btn btn-outline-secondary" (click)="cancel()">Cancelar</button>
        <button type="submit" class="btn btn-primary">{{ isEdit() ? 'Guardar cambios' : 'Publicar' }}</button>
    </div>
</form>
