<form [formGroup]="form" (ngSubmit)="save()">
    <div class="modal-header">
        <h5 class="modal-title">{{ isEdit() ? 'Editar vivienda' : 'Nueva vivienda' }}</h5>
        <button type="button" class="btn-close" aria-label="Cerrar" (click)="cancel()"></button>
    </div>

    <div class="modal-body">
        <div class="mb-3">
            <label for="name" class="form-label">Nombre del piso</label>
            <input id="name" type="text" class="form-control" formControlName="name"
                [class.is-invalid]="isInvalid('name')" placeholder="Ej: Piso Miño 12" />
            <div class="invalid-feedback">El nombre es obligatorio (máximo 60 caracteres).</div>
        </div>

        <div class="mb-3">
            <label for="address" class="form-label">Dirección</label>
            <input id="address" type="text" class="form-control" formControlName="address"
                [class.is-invalid]="isInvalid('address')" placeholder="Calle, número, ciudad" />
            <div class="invalid-feedback">La dirección es obligatoria (máximo 120 caracteres).</div>
        </div>

        <div class="row">
            <div class="col-md-6 mb-3">
                <label for="rooms" class="form-label">Habitaciones</label>
                <input id="rooms" type="number" class="form-control" formControlName="rooms"
                    [class.is-invalid]="isInvalid('rooms')" />
                <div class="invalid-feedback">
                    Indica un número entero entre {{ minRooms() }} y 20.
                </div>
            </div>

            <div class="col-md-6 mb-3">
                <label for="monthlyRent" class="form-label">Alquiler mensual (€)</label>
                <input id="monthlyRent" type="number" step="0.01" class="form-control" formControlName="monthlyRent"
                    [class.is-invalid]="isInvalid('monthlyRent')" />
                <div class="invalid-feedback">El alquiler debe ser mayor que 0.</div>
            </div>
        </div>

        <div class="mb-1">
            <label for="mode" class="form-label">Modo de gestión</label>
            <select id="mode" class="form-select" formControlName="mode">
                @for (m of modes; track m.value) {
                <option [value]="m.value">{{ m.label }}</option>
                }
            </select>
        </div>
    </div>

    <div class="modal-footer">
        <button type="button" class="btn btn-outline-secondary" (click)="cancel()">Cancelar</button>
        <button type="submit" class="btn btn-primary">{{ isEdit() ? 'Guardar cambios' : 'Crear vivienda' }}</button>
    </div>
</form>
