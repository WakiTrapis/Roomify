<form [formGroup]="form" (ngSubmit)="save()">
    <div class="modal-header">
        <h5 class="modal-title">{{ isEdit() ? 'Editar factura' : 'Nueva factura' }}</h5>
        <button type="button" class="btn-close" aria-label="Cerrar" (click)="cancel()"></button>
    </div>

    <div class="modal-body">
        <div class="mb-3">
            <label for="concept" class="form-label">Concepto</label>
            <input id="concept" type="text" class="form-control" formControlName="concept"
                [class.is-invalid]="isInvalid('concept')" placeholder="Ej: Factura de luz" />
            <div class="invalid-feedback">El concepto es obligatorio (máximo 80 caracteres).</div>
        </div>

        <div class="row">
            <div class="col-md-6 mb-3">
                <label for="amount" class="form-label">Importe (€)</label>
                <input id="amount" type="number" step="0.01" class="form-control" formControlName="amount"
                    [class.is-invalid]="isInvalid('amount')" />
                <div class="invalid-feedback">El importe debe ser mayor que 0.</div>
            </div>

            <div class="col-md-6 mb-3">
                <label for="date" class="form-label">Fecha</label>
                <input id="date" type="date" class="form-control" formControlName="date"
                    [class.is-invalid]="isInvalid('date')" />
                <div class="invalid-feedback">La fecha es obligatoria.</div>
            </div>
        </div>

        <div class="row">
            <div class="col-md-6 mb-3">
                <label for="category" class="form-label">Categoría</label>
                <select id="category" class="form-select" formControlName="category">
                    @for (c of categories; track c.value) {
                    <option [value]="c.value">{{ c.label }}</option>
                    }
                </select>
            </div>

            <div class="col-md-6 mb-3">
                <label for="status" class="form-label">Estado</label>
                <select id="status" class="form-select" formControlName="status">
                    @for (s of statuses; track s.value) {
                    <option [value]="s.value">{{ s.label }}</option>
                    }
                </select>
            </div>

            <div class="mb-1">
                <label class="form-label">Foto de la factura</label>
                <app-photo-upload [(photo)]="photo" />
            </div>
        </div>
    </div>

    <div class="modal-footer">
        <button type="button" class="btn btn-outline-secondary" (click)="cancel()">Cancelar</button>
        <button type="submit" class="btn btn-primary">{{ isEdit() ? 'Guardar cambios' : 'Crear factura' }}</button>
    </div>
</form>
