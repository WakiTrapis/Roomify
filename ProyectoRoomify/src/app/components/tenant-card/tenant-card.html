<div class="card shadow-sm h-100">
    <div class="card-body d-flex flex-column">
        <div class="d-flex align-items-center gap-3 mb-3">
            <div class="avatar rounded-circle bg-primary-subtle text-primary fw-semibold
                d-flex align-items-center justify-content-center">
                {{ initials() }}
            </div>
            <div class="flex-grow-1">
                <h5 class="card-title mb-0">{{ tenant().fullName }}</h5>
                <small class="text-muted">{{ roleLabel() }}</small>
            </div>
            <span class="badge" [class]="statusBadge()">{{ statusLabel() }}</span>
        </div>

        <ul class="list-unstyled small mb-3">
            <li class="mb-1"><i class="bi bi-envelope me-2 text-muted"></i>{{ tenant().email }}</li>
            <li class="mb-1"><i class="bi bi-telephone me-2 text-muted"></i>{{ tenant().phone }}</li>
            <li><i class="bi bi-cash-coin me-2 text-muted"></i>Cuota mensual: {{ tenant().monthlyShare.toFixed(2) }} €
            </li>
        </ul>

        <div class="mt-auto d-flex gap-2">
            <button type="button" class="btn btn-sm btn-outline-primary" (click)="edit.emit(tenant())">
                <i class="bi bi-pencil"></i> Editar
            </button>
            <button type="button" class="btn btn-sm btn-outline-danger" (click)="remove.emit(tenant())">
                <i class="bi bi-trash"></i> Eliminar
            </button>
        </div>
    </div>
</div>
