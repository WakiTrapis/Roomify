<input #fileInput type="file" class="d-none" accept="image/jpeg,image/png,image/webp"
    (change)="onFileSelected($event)" />

@if (photo(); as src) {
<div class="border rounded p-2 text-center">
    <img [src]="src" alt="Vista previa de la foto" class="img-fluid rounded preview" />
    <div class="d-flex justify-content-center gap-2 mt-2">
        <button type="button" class="btn btn-sm btn-outline-primary" (click)="fileInput.click()">
            <i class="bi bi-arrow-repeat"></i> Cambiar foto
        </button>
        <button type="button" class="btn btn-sm btn-outline-danger" (click)="remove()">
            <i class="bi bi-trash"></i> Quitar
        </button>
    </div>
</div>
} @else {
<button type="button" class="btn btn-outline-secondary w-100 py-3 upload-box" (click)="fileInput.click()">
    <i class="bi bi-camera fs-4 d-block mb-1"></i>
    Subir foto
    <small class="d-block text-muted">JPG, PNG o WebP, máximo {{ maxSizeMb }} MB</small>
</button>
}

@if (error()) {
<div class="text-danger small mt-1">{{ error() }}</div>
}
