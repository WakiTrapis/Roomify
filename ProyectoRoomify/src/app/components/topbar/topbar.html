<header class="d-flex align-items-center justify-content-between bg-white border-bottom px-3 px-md-4 py-2">
    <div class="d-flex align-items-center gap-2">
        <button type="button" class="btn btn-light d-lg-none" aria-label="Abrir menú" (click)="menuToggle.emit()">
            <i class="bi bi-list fs-5"></i>
        </button>
        <div>
            <small class="text-muted d-block">Vivienda</small>
            <span class="fw-semibold">{{ flatName }}</span>
        </div>
    </div>

    <div class="d-flex align-items-center gap-3">
        <button type="button" class="btn btn-light position-relative" aria-label="Notificaciones">
            <i class="bi bi-bell"></i>
        </button>
        <div class="d-flex align-items-center gap-2">
            <div class="rounded-circle bg-primary-subtle text-primary d-flex align-items-center justify-content-center"
                style="width: 36px; height: 36px;">
                <i class="bi bi-person-fill"></i>
            </div>
            <span class="d-none d-md-inline">{{ userName }}</span>
        </div>
    </div>
</header>
