<div class="login-wrapper d-flex align-items-center justify-content-center p-3">
    <div class="card shadow-sm login-card">
        <div class="card-body p-4">
            <div class="text-center mb-4">
                <div class="brand-circle rounded-circle d-inline-flex align-items-center justify-content-center mb-3">
                    <i class="bi bi-house-heart-fill fs-3"></i>
                </div>
                <h3 class="mb-1">¡Hola de nuevo!</h3>
                <small class="text-muted">Inicia sesión para gestionar tu vivienda</small>
            </div>

            <form [formGroup]="form" (ngSubmit)="submit()">
                <div class="mb-3">
                    <label for="email" class="form-label">Correo electrónico</label>
                    <input id="email" type="email" class="form-control" formControlName="email"
                        [class.is-invalid]="isInvalid('email')" placeholder="tu_correo@ejemplo.com" />
                    <div class="invalid-feedback">Introduce un correo electrónico válido.</div>
                </div>

                <div class="mb-4">
                    <label for="password" class="form-label">Contraseña</label>
                    <div class="input-group has-validation">
                        <input id="password" [type]="showPassword() ? 'text' : 'password'" class="form-control"
                            formControlName="password" [class.is-invalid]="isInvalid('password')" />
                        <button type="button" class="btn btn-outline-secondary" (click)="togglePassword()"
                            [attr.aria-label]="showPassword() ? 'Ocultar contraseña' : 'Mostrar contraseña'">
                            <i class="bi" [class.bi-eye]="!showPassword()" [class.bi-eye-slash]="showPassword()"></i>
                        </button>
                        <div class="invalid-feedback">La contraseña debe tener al menos 6 caracteres.</div>
                    </div>
                </div>

                <button type="submit" class="btn btn-primary w-100">Iniciar sesión</button>
            </form>
        </div>
    </div>
</div>
