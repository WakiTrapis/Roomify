<div class="d-flex justify-content-between align-items-center flex-wrap gap-2 mb-4">    <div>
        <h2 class="mb-0">Comunicados</h2>
        <small class="text-muted">Normas de la vivienda y avisos a los inquilinos</small>
    </div>
    <button type="button" class="btn btn-primary" (click)="openAdd()">
        <i class="bi bi-plus-lg me-1"></i>Nuevo comunicado
    </button>
</div>

<div class="card shadow-sm">
    <div class="table-responsive">
        <table class="table table-hover align-middle mb-0">
            <thead class="table-light">
                <tr>
                    <th>Título</th>
                    <th>Tipo</th>
                    <th>Fecha</th>
                    <th class="text-end">Acciones</th>
                </tr>
            </thead>
            <tbody>
                @for (notice of notices(); track notice.id) {
                <tr>
                    <td>
                        <div class="fw-medium">{{ notice.title }}</div>
                        <small class="text-muted d-inline-block text-truncate" style="max-width: 360px;">
                            {{ notice.content }}
                        </small>
                    </td>
                    <td>
                        <span class="badge" [class]="typeBadge(notice.type)">
                            {{ typeLabel(notice.type) }}
                        </span>
                    </td>
                    <td>{{ notice.date }}</td>
                    <td class="text-end">
                        <button type="button" class="btn btn-sm btn-outline-primary me-1" (click)="openEdit(notice)">
                            <i class="bi bi-pencil"></i> Editar
                        </button>
                        <button type="button" class="btn btn-sm btn-outline-danger" (click)="openDelete(notice)">
                            <i class="bi bi-trash"></i> Eliminar
                        </button>
                    </td>
                </tr>
                } @empty {
                <tr>
                    <td colspan="4" class="text-center text-muted py-4">No hay comunicados publicados</td>
                </tr>
                }
            </tbody>
        </table>
    </div>
</div>
